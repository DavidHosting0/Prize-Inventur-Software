name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prize
          POSTGRES_PASSWORD: prize
          POSTGRES_DB: prize_hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://prize:prize@127.0.0.1:5432/prize_hotel?schema=public
      AUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Prisma migrate + generate
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma generate
      - name: Seed
        run: pnpm exec prisma db seed
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
